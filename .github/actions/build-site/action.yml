name: Build and validate site
description: Installs dependencies reproducibly, builds Docusaurus for one environment, and validates the output.

inputs:
  deploy-env:
    description: development | uat | production
    required: true
  site-url:
    description: Origin of the target environment, e.g. https://example.com
    required: true
  base-url:
    description: Base path of the target environment, e.g. / or /repo/
    required: true
  forbidden-urls:
    description: Space-separated absolute URLs of other environments that must not appear in this build
    required: false
    default: ''
  source-repository:
    description: owner/repo used for "edit this page" and GitHub links
    required: false
    default: ''
  commit:
    description: Commit SHA recorded in build-info.json (defaults to github.sha)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.deploy-env }}
        SITE_URL: ${{ inputs.site-url }}
        BASE_URL: ${{ inputs.base-url }}
      run: |
        missing=()
        [ -n "$SITE_URL" ] || missing+=("site-url")
        [ -n "$BASE_URL" ] || missing+=("base-url")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Missing ${missing[*]} for $DEPLOY_ENV. Set the repository variables described in DEPLOYMENT.md."
          exit 1
        fi

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Build (${{ inputs.deploy-env }})
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.deploy-env }}
        SITE_URL: ${{ inputs.site-url }}
        BASE_URL: ${{ inputs.base-url }}
        SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        BUILD_COMMIT: ${{ inputs.commit || github.sha }}
      run: npm run build

    - name: Validate build output
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.deploy-env }}
        SITE_URL: ${{ inputs.site-url }}
        BASE_URL: ${{ inputs.base-url }}
        FORBIDDEN_URLS: ${{ inputs.forbidden-urls }}
      run: npm run validate:build
